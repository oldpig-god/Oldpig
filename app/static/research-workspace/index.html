<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究台 · 观澜</title><link rel="stylesheet" href="/static/shared/theme.css?v=20261114g"><link rel="stylesheet" href="/static/research-workspace/workspace.css?v=20261114g"><script defer src="/static/shared/shell.js?v=20261114g"></script><script defer src="/static/research-workspace/workspace.js?v=20261114g"></script></head><body><main class="personal-workspace"><header class="heading"><div><h1>研究台</h1><p class="muted">把关注的公司放在一起，跟踪证据与变化。</p></div><button id="evaluate">检查当前分组</button></header><div class="layout"><aside class="research-sidebar"><section class="group-panel"><div class="sidebar-section-heading"><h2>我的分组</h2><span id="groups-total"></span></div><label class="visually-hidden" for="group">当前研究分组</label><select id="group"></select><div class="group-overview"><span id="group-member-count">—</span><span>只证券</span></div><div id="members"></div><label class="add-security-label" for="search">添加证券</label><input id="search" placeholder="搜索名称或代码" autocomplete="off"><div id="search-results"></div><details class="group-manage"><summary>管理分组</summary><label>分组名称<input id="group-name" maxlength="32"></label><div class="actions"><button id="rename">重命名</button><button id="new-group">新建</button><button id="delete-group">删除</button></div></details></section><details class="reminder-panel"><summary>变化提醒 <span id="alert-count">0</span></summary><label><input id="reminders" type="checkbox"> 记录状态变化</label><p class="muted">检查分组时记录变化，首次检查建立基线。</p><button id="ack">全部标为已读</button><div id="alerts"></div></details><div class="research-shortcuts"><a href="/discover">寻找行业组合 <span>↗</span></a><a href="/compare">比较两个对象 <span>↗</span></a></div></aside><section class="content"><div class="research-context"><div><span class="context-label">当前分组</span><h2 id="active-group-name">我的研究</h2></div><div class="context-stats"><span><b id="checked-count">0</b> 已检查</span><span><b id="conflict-count">0</b> 有分歧</span></div></div><section class="research-toolbar"><div class="toolbar-main"><details id="research-filters"><summary>筛选研究结果</summary><div class="filters"><label>趋势<select id="trend"><option value="">全部</option><option value="up">上行</option><option value="down">下行</option><option value="mixed">混合</option><option value="unknown">暂不判断</option></select></label><label>自身波动<select id="risk"><option value="">全部</option><option value="high">偏高</option><option value="normal">中间</option><option value="low">偏低</option><option value="unknown">暂不判断</option></select></label><label>相对宽基<select id="relative"><option value="">全部</option><option value="outperform">跑赢</option><option value="underperform">落后</option><option value="unknown">暂不判断</option></select></label><label><input id="conflicts" type="checkbox"> 仅证据分歧</label></div></details><button id="compare" disabled>并排比较 0/2</button><button id="exit-compare" hidden>返回分组</button><details class="chart-settings"><summary>图表设置</summary><div class="settings"><label>图表范围<select id="range"><option value="60">60 交易日</option><option value="120">120 交易日</option><option value="250">250 交易日</option><option value="2000">全部可用历史</option></select></label><label><input id="show-ma" type="checkbox"> 显示均线</label><button id="save-settings">保存设置</button></div></details></div></section><p id="message" role="status">正在读取个人工作区…</p><p id="result-count" class="muted"></p><div id="cards" class="cards"></div></section></div><footer>后复权日线研究 · 宽基为沪深300 ETF · 历史表现不代表未来表现</footer></main></body></html>
