<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人研究台 · 观澜</title><link rel="stylesheet" href="/static/shared/theme.css"><link rel="stylesheet" href="/static/research-workspace/workspace.css"><script defer src="/static/shared/shell.js"></script><script defer src="/static/research-workspace/workspace.js"></script></head><body><main><header class="heading"><div><p class="kicker">DAILY RESEARCH / 日更研究</p><h1>让每一次观察，都有依据。</h1><p class="muted">从方向、风险和相对表现出发，寻找证据之间的分歧。</p></div><button id="evaluate">检查当前分组</button></header><p id="message" role="status">正在读取个人工作区…</p><div class="layout"><aside><section class="box"><h2>我的研究分组</h2><label>当前分组<select id="group"></select></label><label>分组名称<input id="group-name" maxlength="32"></label><div class="actions"><button id="rename">重命名</button><button id="new-group">新建</button><button id="delete-group">删除</button></div><label>添加股票或 ETF<input id="search" placeholder="名称或证券代码" autocomplete="off"></label><div id="search-results"></div><div id="members"></div></section><section class="box"><h2>变化提醒</h2><label><input id="reminders" type="checkbox"> 记录状态变化</label><p class="muted">执行检查时记录；首次检查建立基线。仅站内提醒，不后台推送。</p><button id="ack">全部标为已读</button><div id="alerts"></div></section></aside><section class="content"><section class="box toolbar"><div class="filters"><label>趋势<select id="trend"><option value="">全部</option><option value="up">上行</option><option value="down">下行</option><option value="mixed">混合</option><option value="unknown">暂不判断</option></select></label><label>自身波动<select id="risk"><option value="">全部</option><option value="high">偏高</option><option value="normal">中间</option><option value="low">偏低</option><option value="unknown">暂不判断</option></select></label><label>相对宽基<select id="relative"><option value="">全部</option><option value="outperform">跑赢</option><option value="underperform">落后</option><option value="unknown">暂不判断</option></select></label><label><input id="conflicts" type="checkbox"> 仅证据分歧</label></div><div class="filters settings"><label>图表范围<select id="range"><option value="60">60 交易日</option><option value="120">120 交易日</option><option value="250">250 交易日</option><option value="2000">全部可用历史</option></select></label><label><input id="show-ma" type="checkbox"> 显示均线</label><button id="save-settings">保存图表设置</button><button id="compare" disabled>并排比较 0/2</button><button id="exit-compare" hidden>返回分组</button></div></section><p id="result-count" class="muted"></p><div id="cards" class="cards"></div></section></div><footer>日线后复权价格研究，宽基采用沪深300 ETF（510300.SH）；价格变化不等于税后分红总回报。阈值是透明的研究规则，并非经验证的交易优势。历史表现不代表未来，不构成投资建议。</footer></main></body></html>
